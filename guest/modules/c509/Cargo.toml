[package]
name = "c509"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["component"]
# wasm32-wasip2 component export (wit-bindgen), used by host/rust and host/js.
component = ["dep:wit-bindgen"]
# plain wasm32-wasip1 core-module export (hand-rolled C ABI), used by host/go.
wasip1 = []

[dependencies]
shared = { path = "../../shared" }
wit-bindgen = { version = "0.57", optional = true }
c509-cert = { git = "https://github.com/bkioshn/c509-cert" }
serde_json = "1"
